[project]
name = "barq-ai-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karim3637", email = "karimtaha0303@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.3",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.52.4",
    "beautifulsoup4>=4.14.0",
    # --- S3.5 PDF ingestion CLI (cli/ingest_pdf.py, search_pdf.py, run_eval.py) ---
    "pymupdf>=1.24",      # PDF loading + page rendering
    "pillow>=10",         # image handling for Vision payloads
    "openai>=1.40",       # OpenAI-compatible client (LiteLLM proxy: embeddings + Vision)
    # --- Synthetic fixture generators only (cli/make_*.py) ---
    "reportlab>=4",
    "arabic-reshaper>=3",
    "python-bidi>=0.4",
]

[project.scripts]
barq-ai-support = "barq_ai_support:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]