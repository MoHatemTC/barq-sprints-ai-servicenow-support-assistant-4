[project]
name = "barq-ai-support"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Karim3637", email = "karimtaha0303@gmail.com" }
]
requires-python = ">=3.14"

dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=2.24.0",
    "httpx>=0.28.1",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.6.3",
    "langchain-openai>=0.1.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "qdrant-client>=1.19.1",
    "uvicorn>=0.52.4",
    "beautifulsoup4>=4.14.0",

    # --- S3.4 / S3.6 agent, worker, tracing ---
    "celery>=5.6.3",
    "redis>=8.1.0",
    "sqlalchemy>=2.1.0",
    "langfuse>=2.60.0",

    # --- S3.5 PDF ingestion CLI ---
    "pymupdf>=1.24",
    "pillow>=10",
    "openai>=1.40",

    # --- Synthetic fixture generators ---
    "reportlab>=4",
    "arabic-reshaper>=3",
    "python-bidi>=0.4",
]

[project.scripts]
barq-ai-support = "barq_ai_support:main"

[build-system]
requires = ["uv_build>=0.12.11,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"